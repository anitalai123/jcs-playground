<!doctype html>
<html lang="en" class="govuk-template">
<head>

  <title>Young people – November sprint – Work hub – Prototype</title>
  <!-- GOV.UK Frontend 6.5.1 (https://design-system.service.gov.uk/), served from /assets so the GDS Transport font loads -->

  <link rel="stylesheet" href="/menu-shared/menu.css">
  <link rel="stylesheet" href="../home.css">

  <script>document.body.className += ' js-enabled' + ('noModule' in HTMLScriptElement.prototype ? ' govuk-frontend-supported' : '');</script>

  <a href="#main-content" class="govuk-skip-link" data-module="govuk-skip-link">Skip to main content</a>

  <header class="govuk-template__header">

          <nav aria-label="Menu" class="govuk-service-navigation__wrapper">
            <button type="button" class="govuk-service-navigation__toggle govuk-js-service-navigation-toggle" aria-controls="navigation" hidden aria-hidden="true">

              <li class="govuk-service-navigation__item"><a class="govuk-service-navigation__link" href="#">Find a job</a></li>
              <li class="govuk-service-navigation__item"><a class="govuk-service-navigation__link" href="#">Build a CV</a></li>
              <li class="govuk-service-navigation__item"><a class="govuk-service-navigation__link" href="#">Action plan</a></li>
              <li class="govuk-service-navigation__item">

              </li>
            </ul>
          </nav>
        </div>
        <nav class="govuk-language-navigation" aria-label="Language">
          <ul class="govuk-language-navigation__list">
            <li class="govuk-language-navigation__list-item">
              <span class="govuk-language-navigation__text" aria-current="true" lang="en">English</span>
            </li>
            <li class="govuk-language-navigation__list-item">
              <a class="govuk-language-navigation__link" href="#" rel="alternate" lang="cy" hreflang="cy">Cymraeg</a>
            </li>
          </ul>
        </nav>
      </div>
    </section>

    <div data-nov-sprint="mega-menu"></div>
  </header>

  <div class="govuk-width-container">
    <div class="govuk-phase-banner">
      <p class="govuk-phase-banner__content">
        <a href="/" class="govuk-link govuk-link--no-underline"><strong class="govuk-tag govuk-tag--red govuk-phase-banner__content__tag">Prototype</strong><span class="govuk-visually-hidden"> – go to all prototypes</span></a>
        <span class="govuk-phase-banner__text">This is a prototype: November sprint</span>
      </p>
    </div>

  <div class="jcs-home-hero">

      <img class="jcs-home-hero__image" src="/menu-shared/images/young_people.svg" alt="" aria-hidden="true" width="343" height="201">
      <div class="jcs-home-hero__text">
        <h1 class="govuk-heading-xl jcs-home-hero__heading">Young people page</h1>
        <p class="govuk-body-l jcs-home-hero__body">Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor.</p>

    <main class="govuk-main-wrapper" id="main-content"></main>
